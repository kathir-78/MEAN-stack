
@if (isLoading) {
    <mat-spinner></mat-spinner>
}
<section class="signup-container" [attr.inert]="isLoading ? true : null">
    <header>
        <h2>SignUp</h2>
    </header>
    <form (submit)="onSubmit(signupForm)" #signupForm="ngForm" class="signup-form">
        <mat-card >
            <mat-form-field>
                <mat-label>Email</mat-label>
                <input
                type="email"
                matInput
                ngModel
                name="email"
                required email #emailinput="ngModel">
                @if(emailinput.invalid) {
                    <mat-error> Please enter a valid email.</mat-error> }
            </mat-form-field>
            <mat-form-field>
                <mat-label>Password</mat-label>
                <input
                type="password"
                matInput
                ngModel
                name="password"
                required  #passinput="ngModel">
                @if(passinput.invalid) {
                    <mat-error> Password must be at least 6 characters long.</mat-error> }
            </mat-form-field>
                <button mat-stroked-button type="submit"  class="custom-red-button"> submit</button>
        </mat-card>
    </form>
</section>
